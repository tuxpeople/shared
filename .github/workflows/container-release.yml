name: "Release: container image"

# Reusable image release for public application repositories: multi-arch build
# to ghcr.io/<owner>/<repo>, Cosign signature and verification, Trivy scan with
# SARIF upload, SBOM, GitHub attestations.
#
# Tests stay in the calling repository, they differ per language. Run them in a
# job this one needs. The version comes from version.txt.
#
# Not for private repositories: actions/attest and code scanning need
# Enterprise Cloud there.
#
# Images are signed by this workflow, not by the calling one, so verify with:
#
#   cosign verify \
#     --certificate-identity-regexp '^https://github\.com/tuxpeople/shared/\.github/workflows/container-release\.yml@' \
#     --certificate-github-workflow-repository <owner>/<repo> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     ghcr.io/<owner>/<repo>:latest
#
#   gh attestation verify oci://ghcr.io/<owner>/<repo>:latest --owner <owner>
#
# Caller:
#
#   jobs:
#     image:
#       permissions:
#         contents: write # Attach the SBOM to the GitHub Release
#         packages: write
#         id-token: write
#         security-events: write
#         attestations: write
#         artifact-metadata: write
#       uses: tuxpeople/shared/.github/workflows/container-release.yml@<sha> # vX.Y.Z
#       with:
#         ref: ${{ inputs.ref || github.sha }}
#         attach-sbom: ${{ needs.release-please.outputs.released == 'true' }}

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag/Branch/SHA to build"
        type: string
        required: true
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: Dockerfile
      attach-sbom:
        description: "Attach the SBOM to the GitHub Release of this version"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Resolve version
        id: v
        run: |
          version="$(cat version.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The full version first: it becomes org.opencontainers.image.version
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=${{ steps.v.outputs.major_minor }}
            type=raw,value=${{ steps.v.outputs.major }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      # The certificate names this workflow; the repository check binds the
      # signature to the calling repository
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/tuxpeople/shared/\.github/workflows/container-release\.yml@' \
            --certificate-github-workflow-repository "${{ github.repository }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" \
            > /dev/null
          echo "✅ Signature verified"

      - name: Install trivy
        env:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          TRIVY_VERSION: v0.76.1
        run: curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"

      # Only actionable findings: CRITICAL/HIGH with an available fix
      - name: Scan image for vulnerabilities
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        run: |
          trivy image --quiet --format spdx-json --output sbom.spdx.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attach SBOM to GitHub Release
        if: inputs.attach-sbom
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.v.outputs.tag }}" sbom.spdx.json --clobber
